[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facsimile"
version = "0.1.0"
description = "Visual document RAG with late-interaction page-image embeddings"
requires-python = ">=3.11"
dependencies = [
    "pypdfium2>=4.30",
    "Pillow>=10.4",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "numpy>=1.26",
    "anthropic>=0.40",
]

[project.optional-dependencies]
embed = [
    "colpali-engine>=0.3",
    "torch>=2.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["facsimile*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["facsimile"]
omit = ["tests/*"]
