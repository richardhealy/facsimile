[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facsimile"
version = "0.1.0"
description = "Visual document RAG using late-interaction page-image embeddings"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "qdrant-client>=1.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
embedding = [
    "torch>=2.2",
    "transformers>=4.40",
    "colpali-engine>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["facsimile"]
