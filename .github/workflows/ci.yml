name: CI

on:
  push:
    branches: [main, "claude2/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check facsimile tests

      - name: Test
        run: pytest tests/ -v --cov=facsimile --cov-report=term-missing
